name: Tests and AppImage
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      XDG_CONFIG_HOME: /tmp/duplicate-finder-test-config
      DF_PYTHON: python
      DF_BUILD_ROOT: /tmp/duplicate-finder-release
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12.15'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - name: Install native build and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tk tcl python3-tk xvfb xauth binutils desktop-file-utils fonts-dejavu-core
      - name: Install pinned Python environment
        run: python -m pip install -r requirements-build.txt
      - name: Lint and validate packaging sources
        run: |
          ruff check .
          python -m pip check
          bash -n packaging/appimage/build-appimage.sh
          desktop-file-validate packaging/appimage/io.github.edjenn1998.DuplicateFinder.desktop
      - name: Engine regression tests
        run: python DuplicateFinder.py --self-test
      - name: Extended regression and GUI tests
        run: |
          xvfb-run -a python -m unittest discover -s tests -v
          xvfb-run -a python DuplicateFinder.py --gui-self-test
      - name: Build, audit and test final AppImage
        run: bash packaging/appimage/build-appimage.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: DuplicateFinder-Linux-x86_64
          path: dist/
          if-no-files-found: error
          retention-days: 30
